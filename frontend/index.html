<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Test Failure Visualization Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      margin: 0;
      background: #f6f8fb;
      color: #1f2937;
    }
    .shell {
      max-width: 1100px;
      margin: 0 auto;
      padding: 40px 24px;
    }
    .card {
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.06);
      margin-bottom: 20px;
    }
    h1 { margin-top: 0; }
    .chart-wrap { height: 320px; }
    .muted { color: #6b7280; }
  </style>
</head>
<body>
  <main class="shell">
    <section class="card">
      <h1>Test Failure Visualization Dashboard</h1>
      <p class="muted">Placeholder UI for visualizing JUnit failures across builds and over time.</p>
    </section>

    <section class="card">
      <h2>Failure Trend</h2>
      <div class="chart-wrap">
        <canvas id="failureTrendChart"></canvas>
      </div>
    </section>

    <section class="card">
      <h2>Top Failing Tests</h2>
      <div class="chart-wrap">
        <canvas id="topFailuresChart"></canvas>
      </div>
    </section>
  </main>
</body>
</html>
